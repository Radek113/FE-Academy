openapi: 3.0.3
info:
  title: Photo Portfolio API
  version: 1.0.0
  description: Read-only public API serving image metadata.
servers:
  - url: /api
tags:
  - name: images
paths:
  /images/metadata:
    get:
      tags: [images]
      operationId: getImagesMetadata
      summary: List metadata of all images
      responses:
        '200':
          description: List of image entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImageMetadata'
components:
  schemas:
    ImageTag:
      type: string
      enum: [nature, landscape, city, night, portrait, sea, street, architecture, travel, wildlife]
    ImageMetadata:
      type: object
      required: [id, title, location, date, takenWith, width, height, previewUrl, detailedUrl, tags]
      properties:
        id: { type: string }
        title: { type: string }
        location: { type: string }
        date: { type: string, format: date-time }
        takenWith:
          type: string
          description: Phone or camera model used
        width: { type: integer, description: Width of the detailed image in px }
        height: { type: integer, description: Height of the detailed image in px }
        previewUrl: { type: string, format: uri, description: Smaller image for the gallery }
        detailedUrl: { type: string, format: uri, description: Full quality image }
        thumbhash:
          type: string
          description: Base64 ThumbHash of the image, used as a blurred placeholder while previewUrl loads
        tags:
          type: array
          items: { $ref: '#/components/schemas/ImageTag' }
