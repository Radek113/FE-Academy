<ng-container *transloco="let t; prefix: prefix">
  <mat-toolbar>
    <div class="page-container toolbar-content">
      <a
        routerLink="/"
        class="brand"
        data-tst="header-brand"
        [attr.aria-label]="t('homeAriaLabel')"
      >
        <mat-icon aria-hidden="true">photo_camera</mat-icon>
      </a>

      <nav class="nav" [attr.aria-label]="t('mainNavAriaLabel')">
        @for (link of links; track link.path) {
          <a
            mat-button
            data-tst="header-nav-link"
            [routerLink]="link.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: link.exact }"
          >
            <mat-icon aria-hidden="true">{{ link.icon }}</mat-icon>
            {{ t(link.labelKey) }}
          </a>
        }
      </nav>

      <div class="settings">
        <button
          mat-button
          type="button"
          class="language-button"
          data-tst="header-language-button"
          [attr.aria-label]="
            t('language.label') + ': ' + t('language.' + languageService.language())
          "
          [matMenuTriggerFor]="languageMenu"
        >
          <img
            class="flag"
            [src]="'assets/flags/' + languageService.language() + '.svg'"
            alt=""
            width="20"
            height="14"
          />
          <span class="language-code" data-tst="header-language-code">{{
            languageService.language().toUpperCase()
          }}</span>
          <mat-icon iconPositionEnd aria-hidden="true">arrow_drop_down</mat-icon>
        </button>
        <mat-menu #languageMenu="matMenu" xPosition="before">
          @for (lang of languages; track lang) {
            <button
              mat-menu-item
              type="button"
              [attr.data-tst]="'header-language-option-' + lang"
              [attr.lang]="lang"
              [attr.aria-current]="lang === languageService.language() ? 'true' : null"
              (click)="languageService.setLanguage(lang)"
            >
              <img
                class="flag"
                [src]="'assets/flags/' + lang + '.svg'"
                alt=""
                width="20"
                height="14"
              />
              <span>{{ t('language.' + lang) }}</span>
              @if (lang === languageService.language()) {
                <mat-icon class="check" aria-hidden="true">check</mat-icon>
              }
            </button>
          }
        </mat-menu>

        <button
          mat-icon-button
          type="button"
          class="theme-toggle"
          data-tst="header-theme-toggle"
          [attr.aria-pressed]="themeService.theme() === 'dark'"
          [attr.aria-label]="t('theme.toggle')"
          [matTooltip]="themeService.theme() === 'dark' ? t('theme.toLight') : t('theme.toDark')"
          (click)="themeService.toggle()"
        >
          <mat-icon aria-hidden="true">{{
            themeService.theme() === 'dark' ? 'light_mode' : 'dark_mode'
          }}</mat-icon>
        </button>
      </div>

      <button
        mat-icon-button
        class="menu-button"
        data-tst="header-menu-button"
        type="button"
        [attr.aria-label]="t('openMenuAriaLabel')"
        [matMenuTriggerFor]="menu"
      >
        <mat-icon>menu</mat-icon>
      </button>
      <mat-menu #menu="matMenu" xPosition="before">
        @for (link of links; track link.path) {
          <a mat-menu-item [routerLink]="link.path">
            <mat-icon aria-hidden="true">{{ link.icon }}</mat-icon>
            <span>{{ t(link.labelKey) }}</span>
          </a>
        }
      </mat-menu>
    </div>
  </mat-toolbar>
</ng-container>
