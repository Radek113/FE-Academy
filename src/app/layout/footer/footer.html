<ng-container *transloco="let t; prefix: prefix">
  <footer
    class="border-t border-solid border-(--mat-sys-outline-variant) bg-(--mat-sys-surface-container) text-sm text-(--mat-sys-on-surface-variant)"
  >
    <div
      class="mx-auto flex max-w-6xl flex-col items-center gap-2 px-4 py-6 text-center sm:flex-row sm:justify-between sm:px-6 sm:text-left lg:px-8"
    >
      <p class="m-0 flex items-center gap-2">
        <mat-icon aria-hidden="true">photo_camera</mat-icon>
        <span>{{ t('copyright', { year }) }}</span>
      </p>
      <p class="m-0">{{ t('tagline') }}</p>
    </div>
  </footer>
</ng-container>
