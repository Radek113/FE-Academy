<ng-container *transloco="let t; prefix: prefix">
  <section class="hero">
    <div class="hero-content">
      <h1 data-tst="welcome-heading">{{ t('heading') }}</h1>
      <p>{{ t('intro') }}</p>
      <a mat-flat-button routerLink="/photos" data-tst="welcome-cta">
        <mat-icon aria-hidden="true">photo_library</mat-icon>
        {{ t('viewPhotos') }}
      </a>
    </div>
  </section>

  <section class="page-container">
    <div class="features">
      @for (feature of features; track feature.key) {
        <mat-card appearance="outlined" data-tst="welcome-feature">
          <mat-card-header>
            <mat-icon mat-card-avatar aria-hidden="true">
              {{ feature.icon }}
            </mat-icon>
            <mat-card-title>{{ t('features.' + feature.key + '.title') }}</mat-card-title>
          </mat-card-header>
          <mat-card-content>{{ t('features.' + feature.key + '.text') }}</mat-card-content>
        </mat-card>
      }
    </div>
  </section>
</ng-container>
