<div
  *transloco="let t; prefix: prefix"
  class="filter"
  role="group"
  [attr.aria-label]="t('filter.groupLabel')"
>
  <mat-chip-listbox multiple [attr.aria-label]="t('filter.tagsLabel')">
    <mat-chip-option [selected]="!hasSelection()" (selectionChange)="onAllChange($event)">
      {{ t('filter.all') }}
    </mat-chip-option>
    @for (tag of tags(); track tag) {
      <mat-chip-option [selected]="isSelected(tag)" (selectionChange)="onChipChange($event, tag)">
        {{ t('tags.' + tag) }}
      </mat-chip-option>
    }
  </mat-chip-listbox>
</div>
