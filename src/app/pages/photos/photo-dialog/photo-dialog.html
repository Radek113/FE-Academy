<ng-container *transloco="let t; prefix: prefix">
  <div class="flex items-center justify-between pr-2">
    <h2 mat-dialog-title>{{ image().title }}</h2>
    <button matIconButton type="button" mat-dialog-close [attr.aria-label]="t('dialog.close')">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <mat-dialog-content class="!max-h-[75vh]">
    <div class="flex flex-col gap-4 md:flex-row">
      <div
        class="relative flex h-[45vh] min-w-0 flex-1 items-center justify-center bg-gray-100 md:h-[60vh]"
      >
        @if (loading()) {
          <div class="absolute inset-0 flex items-center justify-center">
            <mat-spinner diameter="48" />
          </div>
        }
        <img
          class="max-h-full max-w-full object-contain transition-opacity duration-300"
          [class.opacity-0]="loading()"
          [src]="image().detailedUrl"
          [alt]="image().title"
          (load)="onImageSettled()"
          (error)="onImageSettled()"
        />
      </div>
      <div class="md:w-64 md:shrink-0">
        <dl class="m-0 grid grid-cols-[auto_1fr] gap-x-4 gap-y-1">
          <dt class="font-medium">{{ t('dialog.location') }}</dt>
          <dd class="m-0">{{ image().location }}</dd>
          <dt class="font-medium">{{ t('dialog.date') }}</dt>
          <dd class="m-0">{{ image().date | date: 'longDate' }}</dd>
          <dt class="font-medium">{{ t('dialog.takenWith') }}</dt>
          <dd class="m-0">{{ image().takenWith }}</dd>
        </dl>
        <mat-chip-set class="mt-3" [attr.aria-label]="t('dialog.tagsLabel')">
          @for (tag of image().tags; track tag) {
            <mat-chip>{{ t('tags.' + tag) }}</mat-chip>
          }
        </mat-chip-set>
      </div>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button matButton type="button" [disabled]="!hasPrev()" (click)="prev()">
      <mat-icon>chevron_left</mat-icon>{{ t('dialog.previous') }}
    </button>
    <button matButton type="button" [disabled]="!hasNext()" (click)="next()">
      {{ t('dialog.next') }}<mat-icon iconPositionEnd>chevron_right</mat-icon>
    </button>
    <button matButton="filled" type="button" (click)="download()">
      <mat-icon>download</mat-icon>{{ t('dialog.download') }}
    </button>
  </mat-dialog-actions>
</ng-container>
