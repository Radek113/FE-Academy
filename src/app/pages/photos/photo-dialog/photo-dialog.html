<ng-container *transloco="let t; prefix: prefix">
  <div class="header">
    <h2 mat-dialog-title>{{ image().title }}</h2>
    <button matIconButton type="button" mat-dialog-close [attr.aria-label]="t('dialog.close')">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <mat-dialog-content>
    <div class="layout">
      <div #imageContainer class="viewer" [class.fullscreen]="fullscreen()">
        <button
          matIconButton
          type="button"
          class="fullscreen-button"
          [attr.aria-label]="fullscreen() ? t('dialog.exitFullscreen') : t('dialog.fullscreen')"
          (click)="toggleFullscreen()"
        >
          <mat-icon>{{ fullscreen() ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
        </button>
        @if (loading()) {
          <div class="spinner">
            <mat-spinner diameter="48" />
          </div>
        }
        <img
          role="button"
          tabindex="0"
          (click)="toggleFullscreen()"
          (keydown.enter)="toggleFullscreen()"
          [class.loading]="loading()"
          [src]="image().detailedUrl"
          [alt]="image().title"
          (load)="onImageSettled()"
          (error)="onImageSettled()"
        />
      </div>
      <div class="details">
        <dl>
          <dt>{{ t('dialog.location') }}</dt>
          <dd>{{ image().location }}</dd>
          <dt>{{ t('dialog.date') }}</dt>
          <dd>{{ image().date | date: 'longDate' }}</dd>
          <dt>{{ t('dialog.takenWith') }}</dt>
          <dd>{{ image().takenWith }}</dd>
        </dl>
        <mat-chip-set [attr.aria-label]="t('dialog.tagsLabel')">
          @for (tag of image().tags; track tag) {
            <mat-chip>{{ t('tags.' + tag) }}</mat-chip>
          }
        </mat-chip-set>
      </div>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button matButton type="button" [disabled]="!hasPrev()" (click)="prev()">
      <mat-icon>chevron_left</mat-icon>{{ t('dialog.previous') }}
    </button>
    <button matButton type="button" [disabled]="!hasNext()" (click)="next()">
      {{ t('dialog.next') }}<mat-icon iconPositionEnd>chevron_right</mat-icon>
    </button>
    <button matButton="filled" type="button" (click)="download()">
      <mat-icon>download</mat-icon>{{ t('dialog.download') }}
    </button>
  </mat-dialog-actions>
</ng-container>
