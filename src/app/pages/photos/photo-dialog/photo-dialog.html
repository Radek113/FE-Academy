<ng-container *transloco="let t; prefix: prefix">
  <div class="header">
    <span class="spacer"></span>
    <h2 mat-dialog-title data-tst="photo-dialog-title">{{ image().title }}</h2>
    <button
      matIconButton
      type="button"
      mat-dialog-close
      data-tst="photo-dialog-close"
      [attr.aria-label]="t('dialog.close')"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <mat-dialog-content>
    <div class="layout">
      <div
        #imageContainer
        class="viewer"
        data-tst="photo-dialog-viewer"
        [class.fullscreen]="fullscreen()"
        (touchstart)="onTouchStart($event)"
        (touchend)="onTouchEnd($event)"
      >
        <button
          matIconButton
          type="button"
          class="fullscreen-button"
          data-tst="photo-dialog-fullscreen"
          [attr.aria-label]="fullscreen() ? t('dialog.exitFullscreen') : t('dialog.fullscreen')"
          (click)="toggleFullscreen()"
        >
          <mat-icon>{{ fullscreen() ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
        </button>
        @if (hasPrev()) {
          <button
            matIconButton
            type="button"
            class="nav-button prev"
            data-tst="photo-dialog-nav-prev"
            [attr.aria-label]="t('dialog.previous')"
            (click)="prev()"
          >
            <mat-icon>chevron_left</mat-icon>
          </button>
        }
        @if (hasNext()) {
          <button
            matIconButton
            type="button"
            class="nav-button next"
            data-tst="photo-dialog-nav-next"
            [attr.aria-label]="t('dialog.next')"
            (click)="next()"
          >
            <mat-icon>chevron_right</mat-icon>
          </button>
        }
        @if (loading()) {
          <div class="spinner" data-tst="photo-dialog-spinner">
            <mat-spinner diameter="48" />
          </div>
        }
        <img
          class="main"
          role="button"
          tabindex="0"
          data-tst="photo-dialog-image"
          (click)="toggleFullscreen()"
          (keydown.enter)="toggleFullscreen()"
          [class.loading]="loading()"
          [src]="image().detailedUrl"
          [alt]="image().title"
          (load)="onImageSettled()"
          (error)="onImageSettled()"
        />
        <img class="backdrop" alt="" aria-hidden="true" [src]="image().detailedUrl" />
        <app-photo-info [image]="image()" />
      </div>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button
      matButton
      type="button"
      data-tst="photo-dialog-prev"
      [disabled]="!hasPrev()"
      (click)="prev()"
    >
      <mat-icon>chevron_left</mat-icon>{{ t('dialog.previous') }}
    </button>
    <button
      matButton
      type="button"
      data-tst="photo-dialog-next"
      [disabled]="!hasNext()"
      (click)="next()"
    >
      {{ t('dialog.next') }}<mat-icon iconPositionEnd>chevron_right</mat-icon>
    </button>
    <button
      matButton="filled"
      type="button"
      data-tst="photo-dialog-download"
      [disabled]="downloading()"
      [attr.aria-busy]="downloading()"
      (click)="download()"
    >
      <mat-icon>
        @if (downloading()) {
          <mat-spinner diameter="18" data-tst="photo-dialog-download-spinner" />
        } @else {
          download
        }
      </mat-icon>
      {{ t('dialog.download') }}
    </button>
  </mat-dialog-actions>
</ng-container>
