<ng-container *transloco="let t; prefix: prefix">
  <section class="page-container" data-tst="photos-page">
    <app-photo-filter
      [tags]="allTags"
      [selectedTags]="selectedTags()"
      (selectedTagsChange)="onSelectedTagsChange($event)"
    />

    @if (images.isLoading()) {
      <div class="state" data-tst="photos-loading">
        <mat-spinner diameter="48" />
      </div>
    } @else if (images.error()) {
      <div class="state" data-tst="photos-error">
        <p>{{ t('error') }}</p>
        <button matButton="filled" type="button" data-tst="photos-retry" (click)="images.reload()">
          {{ t('retry') }}
        </button>
      </div>
    } @else {
      @if (filteredImages().length) {
        <div class="gallery" data-tst="photos-gallery">
          @for (image of filteredImages(); track image.id; let i = $index) {
            <app-photo-tile data-tst="photo-tile" [image]="image" (opened)="open(i)" />
          }
        </div>
      } @else {
        <app-photos-empty data-tst="photos-empty" (clearFilters)="onSelectedTagsChange([])" />
      }
    }
  </section>
</ng-container>
