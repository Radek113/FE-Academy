<ng-container *transloco="let t; prefix: prefix">
  <section class="page-container">
    <h1>{{ t('title') }}</h1>

    <app-photo-filter
      [tags]="allTags"
      [selectedTags]="selectedTags()"
      (selectedTagsChange)="onSelectedTagsChange($event)"
    />

    @if (images.isLoading()) {
      <div class="state">
        <mat-spinner diameter="48" />
      </div>
    } @else if (images.error()) {
      <div class="state">
        <p>{{ t('error') }}</p>
        <button matButton="filled" type="button" (click)="images.reload()">{{ t('retry') }}</button>
      </div>
    } @else {
      <div class="gallery">
        @for (image of filteredImages(); track image.id; let i = $index) {
          <app-photo-tile [image]="image" (opened)="open(i)" />
        } @empty {
          <p>{{ t('empty') }}</p>
        }
      </div>
    }
  </section>
</ng-container>
